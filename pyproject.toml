[project]
name = "cua-capability-engine"
version = "0.1.0"
description = "Discover once with an LLM, replay deterministically forever: computer-use capabilities for legacy back-office apps."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Suriya Narayanan Rajavel" }]
dependencies = [
  "anthropic>=1.6",
  "playwright==1.63.0",
  "pydantic>=2.11",
  "pydantic-settings>=2.6",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "jinja2>=3.1",
  "typer>=0.12",
  "structlog>=24.1",
  "pyyaml>=6.0",
  "pillow>=10.0",
  "faker>=30.0",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "hypothesis>=6.100",
  "ruff>=0.6",
  "mypy>=1.11",
  "pre-commit>=3.8",
  "types-PyYAML",
]

[project.scripts]
cua = "cua.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cua"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests", "mockbank"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = ["RUF012", "N818"]

[tool.ruff.lint.per-file-ignores]
"src/cua/surface/playwright_surface.py" = ["E501"]  # embedded JS
"src/cua/agent/prompts.py" = ["E501"]
"tests/*" = ["E501"]
"src/cua/api/app.py" = ["E501"]  # inline HTML

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["cua"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = ["live: needs a real browser or API key"]
