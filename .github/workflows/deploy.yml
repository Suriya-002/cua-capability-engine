name: build-and-deploy
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read, packages: write }
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: repo
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          push: true
          tags: ghcr.io/${{ steps.repo.outputs.name }}:latest,ghcr.io/${{ steps.repo.outputs.name }}:${{ github.sha }}
  azure:
    needs: image
    runs-on: ubuntu-latest
    env:
      HAS_AZURE: ${{ secrets.AZURE_CREDENTIALS != '' }}
    steps:
      - name: skip when no Azure credentials are configured
        if: env.HAS_AZURE != 'true'
        run: echo "AZURE_CREDENTIALS secret not set; image published to ghcr.io only."
      - uses: azure/login@v2
        if: env.HAS_AZURE == 'true'
        with: { creds: "${{ secrets.AZURE_CREDENTIALS }}" }
      - if: env.HAS_AZURE == 'true'
        run: az containerapp update -n cua-demo -g cua-rg --image ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]'):${{ github.sha }}
