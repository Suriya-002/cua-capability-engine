{% extends "base.html" %}{% block body %}
<h3>Open Sub-Account for {{ m.name }} ({{ m.id }})</h3>
{% if error %}<div class="err">{{ error }}</div>{% endif %}
<form method="post">
<table class="form">
<tr><td>Product</td><td><select name="product"><option>Holiday Club</option><option>Vacation Savings</option><option>Money Market</option></select></td></tr>
<tr><td>Nickname</td><td><input name="nickname" size="20"></td></tr>
{% if t.extra_field %}<tr><td>{{ t.extra_field }}</td><td><input name="branch_code" size="6"></td></tr>{% endif %}
<tr><td></td><td><input type="submit" class="btn" value="Open Account"></td></tr></table></form>
{% endblock %}
