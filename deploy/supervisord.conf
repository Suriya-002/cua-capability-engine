[program:xvfb]
command=/usr/bin/Xvfb :99 -screen 0 1280x800x24 -nolisten tcp
priority=10
autorestart=true

[program:wm]
command=/usr/bin/fluxbox
environment=DISPLAY=":99"
priority=20
autorestart=true

[program:x11vnc]
command=/usr/bin/x11vnc -display :99 -forever -shared -nopw -rfbport 5900 -noxdamage
priority=30
autorestart=true

[program:novnc]
command=/usr/bin/websockify --web=/usr/share/novnc 6080 localhost:5900
priority=40
autorestart=true

[program:api]
command=/opt/venv/bin/uvicorn cua.api.app:app --host 127.0.0.1 --port 8000
directory=/app
environment=DISPLAY=":99"
priority=50
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
priority=60
autorestart=true
